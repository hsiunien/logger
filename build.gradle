apply plugin: 'com.android.library'
android {
    compileSdkVersion libs.versions.compileSdk.logger.get().toInteger()
    defaultConfig {
        minSdkVersion libs.versions.minSdk.logger.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.logger.get().toInteger()
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    namespace 'wang.xiunian.android'
}
dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])
    api(libs.gson)
    testImplementation libs.junit.logger
    androidTestImplementation libs.annotation
    androidTestImplementation libs.test.ext.junit
}
